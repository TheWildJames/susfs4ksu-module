name: Build and Release

permissions:
  contents: write

on:
  push:
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout webui branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: webui

      - name: Get latest commit message
        id: commit_message
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%s)
          echo "message=$COMMIT_MSG" >> $GITHUB_OUTPUT

      - name: Build webui branch
        run: |
           npm install
           npm run build

      - name: Copy dist folder to a temporary location
        run: |
          cp -r dist/ ../dist-temp/

      - name: Checkout v1.5.2+ branch
        uses: actions/checkout@v4
        with:
          ref: v1.5.2+

      - name: Remove old contents from webroot folder
        run: |
          rm -rf webroot/*

      - name: Copy contents from dist-temp to webroot
        run: |
          cp -r ../dist-temp/* webroot/

      - name: Commit & Push changes
        run: |
          git config user.name "sidex15"
          git config user.email "24408329+sidex15@users.noreply.github.com"
          if git diff --quiet -- webroot; then
            echo "webroot is already in sync with the webui branch, nothing to push"
            exit 0
          fi
          git add webroot
          git commit -m "WebUI: ${{ steps.commit_message.outputs.message }}"
          git push origin HEAD:v1.5.2+
